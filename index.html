<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JECPORT  MAHIN</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@700&family=Fira+Code:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --cyan: #00f3ff;
      --pink: #ff00ff;
      --gold: #ffcc00;
      --bg: #020406; 
      --card-bg: rgba(6, 11, 19, 0.9); 
      --glass-border: rgba(0, 243, 255, 0.5);
      --neon-glow: 0 0 20px rgba(0, 243, 255, 0.8);
    }

    body { 
      margin: 0; background: var(--bg); color: #fff; 
      font-family: 'Rajdhani', sans-serif; overflow: hidden; 
      user-select: none; -webkit-tap-highlight-color: transparent;
    }

    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 99999; display: flex;
      align-items: center; justify-content: center; backdrop-filter: blur(20px);
    }
    .login-box {
      background: var(--card-bg); padding: 40px 30px; border-radius: 25px;
      border: 2px solid var(--cyan); text-align: center; width: 85%; max-width: 350px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
    }
    .login-box h2 { font-family: 'Orbitron'; color: var(--cyan); margin-bottom: 25px; font-size: 18px; }
    .login-box input {
      width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px;
      border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05);
      color: #fff; text-align: center; font-family: 'Fira Code'; outline: none; box-sizing: border-box;
    }
    .login-box button {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: var(--cyan); color: #000; font-family: 'Orbitron';
      font-weight: 900; cursor: pointer; box-shadow: 0 0 15px var(--cyan);
    }

    #bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

    @keyframes textGlow {
      0%, 100% { text-shadow: 0 0 10px var(--cyan); }
      50% { text-shadow: 0 0 25px var(--cyan), 0 0 35px var(--cyan); }
    }

    #displayHackName {
      color: var(--cyan);
      font-family: 'Orbitron'; font-size: 26px; margin: 0; letter-spacing: 4px;
      font-weight: 900; text-transform: uppercase;
      animation: textGlow 2s infinite ease-in-out;
    }

    header {
      background: linear-gradient(180deg, rgba(0,243,255,0.2) 0%, transparent 100%);
      padding: 30px 20px 20px; text-align: center;
      border-bottom: 2px solid var(--glass-border);
      backdrop-filter: blur(15px);
    }

    .premium-badge {
      background: #ffcc00; color: #000; font-family: 'Orbitron'; font-size: 11px;
      padding: 4px 14px; border-radius: 4px; font-weight: 900;
      display: inline-block; margin-bottom: 10px; box-shadow: 0 0 15px var(--gold);
    }

    .view-screen { height: 100vh; width: 100%; overflow-y: auto; position: relative; display: none; }
    .container { padding: 15px; max-width: 450px; margin: 0 auto; }

    .premium-card { 
      background: var(--card-bg); border: 2px solid var(--glass-border); 
      border-radius: 25px; padding: 25px; margin-bottom: 20px; text-align: center; 
      backdrop-filter: blur(30px); position: relative; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 243, 255, 0.2);
    }

    .radar-beam {
      position: absolute; width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(0, 243, 255, 0.2), transparent 50%);
      top: -50%; left: -50%; animation: rotateRadar 3s linear infinite;
      pointer-events: none;
    }
    @keyframes rotateRadar { to { transform: rotate(360deg); } }

    #currentPeriod {
      color: var(--gold); font-size: 15px; font-weight: 900;
      text-shadow: 0 0 10px var(--gold); background: rgba(255, 204, 0, 0.1);
      padding: 2px 10px; border-radius: 8px; border: 1px solid var(--gold);
    }

    #predictionBox { 
      font-family: 'Orbitron'; font-size: 50px; font-weight: 900; 
      margin: 5px 0; text-shadow: var(--neon-glow); color: #fff;
    }
    
    #numberBox { 
      font-family: 'Fira Code'; font-size: 16px; font-weight: 900; color: #fff; 
      border: 2px solid var(--cyan); background: rgba(0, 243, 255, 0.2); 
      padding: 10px 20px; border-radius: 12px; display: inline-block; margin-bottom: 10px;
    }

    .stat-box-hq { 
      background: rgba(0, 243, 255, 0.05); border: 1px solid var(--glass-border); 
      border-radius: 18px; padding: 15px 5px; text-align: center;
    }

    .stat-label { font-size: 10px; color: #aaa; font-family: 'Orbitron'; font-weight: 900; }
    .stat-val { font-size: 24px; font-weight: 900; display: block; margin-top: 5px; }

    .console-hq { 
      background: rgba(0,0,0,0.8); border-left: 3px solid var(--cyan); 
      border-radius: 8px; padding: 12px; font-family: 'Fira Code'; 
      font-size: 11px; color: #00ffaa; height: 80px; overflow-y: auto; margin-bottom: 20px; 
    }
    
    .data-table-container { 
      background: var(--card-bg); border-radius: 20px; border: 1px solid var(--glass-border); 
      overflow: hidden; margin-bottom: 30px;
    }
    .tabs-hq { display: flex; background: rgba(0, 243, 255, 0.1); padding: 5px; }
    .tab-hq { 
      flex: 1; padding: 12px; border: none; background: transparent; color: #fff; 
      font-family: 'Orbitron'; font-size: 10px; font-weight: 900; cursor: pointer;
    }
    .tab-hq.active { background: var(--cyan); color: #000; border-radius: 10px; }

    table { width: 100%; border-collapse: collapse; }
    th { font-size: 9px; color: var(--cyan); padding: 12px 5px; background: rgba(0,0,0,0.5); }
    td { padding: 15px 2px; font-size: 13px; font-weight: 900; border-bottom: 1px solid rgba(0,243,255,0.1); text-align: center; }

    .footer-text { text-align: center; padding: 20px; font-size: 11px; color: var(--cyan); font-family: 'Fira Code'; font-weight: 900; }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="loginOverlay">
    <div class="login-box">
      <h2>JECPORT  MAHIN</h2>
      <input type="password" id="passInput" placeholder="Enter License Key">
      <button onclick="checkPass()">Login</button>
      <p id="errorMsg" style="color: #ff3366; font-size: 12px; margin-top: 15px; display: none;">ACCESS DENIED! WRONG KEY.</p>
    </div>
  </div>

  <canvas id="bgCanvas"></canvas>

  <div id="toolScreen" class="view-screen">
    <header>
      <div class="premium-badge">JECPORT  MAHIN</div>
      <h1 id="displayHackName">JECPORT  MAHIN</h1>
    </header>

    <div class="container">
      <div class="premium-card">
          <div class="radar-beam"></div>
          <div style="display:flex; justify-content:space-between; align-items: center; font-family:'Orbitron'; margin-bottom: 15px; position: relative; z-index: 20;">
            <span style="color:#fff; font-size: 20px;">NEXT PERIOD: <span id="currentPeriod">---</span></span>
            <span style="color:var(--cyan); font-size: 20px; font-weight: 900;">TIMER: <span id="countdown">30s</span></span>
          </div>
          
          <div id="predictionBox" style="position: relative; z-index: 20;">WAIT</div>
          <div id="numberBox" style="position: relative; z-index: 20;">AI ANALYZING...</div>
          
          <div style="margin-top:20px; position: relative; z-index: 20;">
              <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:8px; font-family:'Orbitron'; font-weight:900;">
                  <span style="color:#aaa">AI CONFIDENCE</span>
                  <span id="confTxt" style="color:var(--cyan)">0%</span>
              </div>
              <div style="height:6px; width:100%; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden; border: 1px solid rgba(0,243,255,0.3);">
                <div id="confBar" style="height:100%; width:0%; background:linear-gradient(90deg, var(--cyan), var(--pink)); transition:2s ease-out;"></div>
              </div>
          </div>
      </div>

      <div class="console-hq" id="aiLogs">>_ INITIALIZING AI ENGINE...</div>

      <div class="stats-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
        <div class="stat-box-hq"><span class="stat-label">PRECISION</span><span id="accuracyRate" class="stat-val" style="color:var(--cyan);">0%</span></div>
        <div class="stat-box-hq"><span class="stat-label">STREAK</span><span id="winStreak" class="stat-val" style="color:var(--pink);">0</span></div>
        <div class="stat-box-hq"><span class="stat-label">WINS</span><span id="winsCount" class="stat-val" style="color:#00ffaa;">0</span></div>
        <div class="stat-box-hq"><span class="stat-label">LOSS</span><span id="lossesCount" class="stat-val" style="color:#ff3366;">0</span></div>
      </div>

      <div class="data-table-container">
          <div class="tabs-hq">
            <button id="predTab" class="tab-hq active" onclick="switchTab('pred')">VVIP LOGS</button>
            <button id="numTab" class="tab-hq" onclick="switchTab('num')">NUMBERS</button>
            <button id="gameTab" class="tab-hq" onclick="switchTab('game')">HISTORY</button>
          </div>
          <div style="max-height: 250px; overflow-y: auto;">
            <table id="dataTable">
                <thead id="tableHeader"></thead>
                <tbody id="tableBody"></tbody>
            </table>
          </div>
      </div>
      <div class="footer-text"></div>
    </div>
  </div>

<script>
  function checkPass() {
    const input = document.getElementById('passInput').value;
    if(input === "hasanjcd037") {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('toolScreen').style.display = 'block';
      startApp();
    } else {
      document.getElementById('errorMsg').style.display = 'block';
    }
  }

  let sessionPredictions = [];
  let sessionNumPredictions = [];
  let state = { results: [], wins: 0, losses: 0, streak: 0, lastP: null, curPred: null, cd: 30, activeTab: 'pred' };

  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  function initParticles() {
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      particles = [];
      for(let i=0; i<120; i++) {
          particles.push({ 
            x: Math.random()*canvas.width, y: Math.random()*canvas.height, 
            vx: (Math.random()-0.5)*0.6, vy: (Math.random()-0.5)*0.6, 
            size: Math.random()*2.5, color: Math.random() > 0.5 ? '#00f3ff' : '#ff00ff'
          });
      }
  }
  function drawParticles() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if(p.x<0 || p.x>canvas.width) p.vx*=-1;
          if(p.y<0 || p.y>canvas.height) p.vy*=-1;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          ctx.fillStyle = p.color; ctx.globalAlpha = 0.4; ctx.fill();
      });
      requestAnimationFrame(drawParticles);
  }
  initParticles(); drawParticles();

  function startApp() {
    const fetchData = async () => {
      try {
        const r = await fetch('https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts='+Date.now());
        const d = await r.json();
        if(d.code === 0) processServerData(d.data.list);
      } catch(e) { console.log("Network Error"); }
    };
    fetchData();
    setInterval(fetchData, 2000); 
    setInterval(() => { if(state.cd > 0) state.cd--; document.getElementById('countdown').innerText = state.cd + 's'; }, 1000);
  }

  // সবার ফোনে একই সিগন্যাল দেখানোর জন্য পিরিয়ড-ভিত্তিক অ্যালগরিদম
  function getAIPrediction(history) {
    const nextIssue = String(BigInt(history[0].issueNumber) + 1n);
    // পিরিয়ড নাম্বারের শেষ ৪ ডিজিট নিয়ে একটি সিড ভ্যালু তৈরি (সবার ফোনে সেম হবে)
    const seed = parseInt(nextIssue.slice(-4));
    
    // সিগন্যাল টাইপ ক্যালকুলেশন (BIG/SMALL)
    const aiType = (seed * 7 + 13) % 2 === 0 ? "BIG" : "SMALL";
    
    // নাম্বার ক্যালকুলেশন (সবার জন্য একই ২টি নাম্বার)
    let numPool = aiType === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
    let n1 = numPool[seed % 5];
    let n2 = numPool[(seed + 3) % 5];
    
    return { type: aiType, nums: [n1, n2] };
  }

  function processServerData(list) {
    const latest = list[0];
    if(latest.issueNumber !== state.lastP) {
      if(state.curPred && state.curPred.period === latest.issueNumber) {
        const actualType = (parseInt(latest.number) >= 5 ? 'BIG' : 'SMALL');
        const actualNum = parseInt(latest.number);
        const isWin = (state.curPred.pick === actualType);
        const isNumWin = state.curPred.nums.includes(actualNum);

        sessionPredictions.unshift({ p: latest.issueNumber, pick: state.curPred.pick, win: isWin });
        sessionNumPredictions.unshift({ p: latest.issueNumber, picks: state.curPred.nums, res: actualNum, win: isNumWin });

        if(isWin || isNumWin) { 
          state.wins++; state.streak++; 
          confetti({particleCount:100, spread:70, origin:{y:0.6}}); 
          addLog(`AI HIT! [${actualNum} ${actualType}]`); 
        } else { 
          state.losses++; state.streak=0; 
          addLog(`CALIBRATING... [${actualNum}]`); 
        }
        updateStats();
      }
      
      const nextP = String(BigInt(latest.issueNumber) + 1n);
      const prediction = getAIPrediction(list);

      state.curPred = { period: nextP, pick: prediction.type, nums: prediction.nums };
      state.lastP = latest.issueNumber; 
      state.cd = 30; 
      
      document.getElementById('currentPeriod').innerText = nextP;
      const pb = document.getElementById('predictionBox');
      pb.innerText = prediction.type;
      pb.style.color = prediction.type === 'BIG' ? 'var(--cyan)' : 'var(--pink)';
      document.getElementById('numberBox').innerText = `AI TARGET: ${prediction.nums[0]} | ${prediction.nums[1]}`;
      
      // কনফিডেন্সও পিরিয়ড অনুযায়ী সেম থাকবে
      let seed = parseInt(nextP.slice(-2));
      let conf = 94 + (seed % 6);
      document.getElementById('confTxt').innerText = conf + '%';
      document.getElementById('confBar').style.width = conf + '%';
    }
    state.results = list; 
    renderTable();
  }

  function updateStats() {
    const total = state.wins + state.losses;
    document.getElementById('accuracyRate').innerText = Math.round((state.wins/(total||1))*100) + '%';
    document.getElementById('winsCount').innerText = state.wins;
    document.getElementById('lossesCount').innerText = state.losses;
    document.getElementById('winStreak').innerText = state.streak;
  }

  function addLog(msg) {
    const lb = document.getElementById('aiLogs');
    lb.innerHTML += `<br>> ${msg}`;
    lb.scrollTop = lb.scrollHeight;
  }

  function switchTab(t) {
    state.activeTab = t;
    document.querySelectorAll('.tab-hq').forEach(b => b.classList.remove('active'));
    document.getElementById(t + 'Tab').classList.add('active');
    renderTable();
  }

  function renderTable() {
    const h = document.getElementById('tableHeader');
    const b = document.getElementById('tableBody');
    if(!b) return;
    b.innerHTML = "";
    if(state.activeTab === 'pred') {
      h.innerHTML = '<tr><th>PERIOD (FULL)</th><th>SIGNAL</th><th>RESULT</th></tr>';
      sessionPredictions.forEach(x => {
        b.innerHTML += `<tr><td style="color:var(--gold)">${x.p}</td><td style="color:${x.pick==='BIG'?'var(--cyan)':'var(--pink)'}">${x.pick}</td><td style="color:${x.win?'#00ffaa':'#ff3366'}">${x.win?'WIN':'LOSS'}</td></tr>`;
      });
    } else if(state.activeTab === 'num') {
      h.innerHTML = '<tr><th>PERIOD (FULL)</th><th>TARGETS</th><th>ACTUAL</th></tr>';
      sessionNumPredictions.forEach(x => {
        b.innerHTML += `<tr><td style="color:var(--gold)">${x.p}</td><td>${x.picks.join(',')}</td><td style="color:${x.win?'#00ffaa':'#ff3366'}">${x.win?'WIN':'LOSS'} (${x.res})</td></tr>`;
      });
    } else {
      h.innerHTML = '<tr><th>PERIOD (FULL)</th><th>NUM</th><th>TYPE</th></tr>';
      state.results.slice(0, 15).forEach(x => {
        const sz = parseInt(x.number) >= 5 ? 'BIG' : 'SMALL';
        b.innerHTML += `<tr><td style="color:var(--gold)">${x.issueNumber}</td><td>${x.number}</td><td style="color:${sz==='BIG'?'var(--cyan)':'var(--pink)'}">${sz}</td></tr>`;
      });
    }
  }
</script>
</body>
</html>
